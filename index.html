    <title>Wonder Mart</title>
     <style>
    @keyframes slidefade {
      0% {
        opacity: 0;
        transform: translateX(100px);
        /* start from right */
      }

      50% {
        opacity: 1;
        transform: translateX(0);
        /* center */
      }

      100% {
        opacity: 0;
        transform: translateX(-100px);
        /* fade left */
      }
    }

    .animate-slidefade {
      animation: slidefade 2.5s ease forwards;
    }
  </style>

  </head>
  <body>
    <!-- Preloader Overlay -->
  <div id="preloader" class="fixed inset-0 bg-slate-100 flex items-center justify-center z-50">
    <img src="src/Images/ChatGPT Image Dec 1, 2025, 04_43_01 PM.png" alt="Wonder Logo" class="w-32 h-32 object-contain animate-slidefade" />
  </div>

  <!-- Preloder hides -->
   <script>
    function hidePreloaderAndInitAOS() {
          const pre = document.getElementById('preloader');
          // duration must match your animation (2.5s) - tweak if you changed that
          const animationWait = 2500;
          if (!pre) {
            // still ensure AOS is available and init
            ensureAOS(initAOS);
            return;
          }

          // Wait the animation duration, then fade preloader out and init AOS
          setTimeout(() => {
            pre.style.opacity = '0';
            pre.style.transition = 'opacity 0.6s ease';
            setTimeout(() => {
              pre.style.display = 'none';
              ensureAOS(initAOS);
            }, 600);
          }, animationWait);
        }

        if (document.readyState === 'complete') {
          hidePreloaderAndInitAOS();
        } else {
          window.addEventListener('load', hidePreloaderAndInitAOS);
        }

      
   </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
